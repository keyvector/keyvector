name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven
      - run: mvn -B -Dspotbugs.skip=true verify
      - run: pip install cfn-lint && cfn-lint deploy/keyvector.yaml
