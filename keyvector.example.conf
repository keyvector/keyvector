# Keyvector configuration. Copy to keyvector.conf and edit.
#
# Every value can also be set by an environment variable named after its path without the
# "keyvector." prefix, upper-cased with dots and dashes as underscores:
#   keyvector.embedder.url          ->  EMBEDDER_URL
#   keyvector.sink.vector-index     ->  SINK_VECTOR_INDEX
# The CloudFormation template configures the container entirely that way.

keyvector {
  REGION = "us-east-1"
  REGION = ${?AWS_REGION}

  stream {
    region = ${keyvector.REGION}
    keyspace-name = "media"
    table-name = "movies"
    # Names the KCL lease tables in DynamoDB (<application-name>-lease-table...). One per
    # table being synced; changing it starts the stream over from the beginning.
    application-name = "keyvector-media-movies"
    connector {
      target-mapper = "dev.keyvector.connector.KeyvectorTargetMapper"
      # Optional JEXL expression; rows it rejects are not indexed at all.
      # jexl-filter-expression = "newImage != null && newImage.language == 'en'"
    }
  }

  sync {
    # What text each row is embedded as: either columns, joined by blank lines...
    text-columns = ["title", "overview"]
    # ...or a template. Set exactly one.
    # text-template = "{title} ({year}): {overview}"
    max-text-chars = 8000

    # Columns stored with each vector, for filtering queries. Timestamps are stored as epoch
    # milliseconds so range filters work. S3 Vectors allows 2 KB of filterable metadata.
    metadata-columns = ["genre", "release_date", "language"]

    # Also store the embedded text under this metadata key. Declare the key non-filterable
    # when creating the index, or its 2 KB filterable limit will reject long texts.
    # store-text-as = "text"

    # When a row's text becomes empty: "delete" its vector, or "skip" and leave it.
    on-empty-text = "delete"

    # Only needed if the stream's records do not carry the primary key (they normally do).
    # key-columns = ["id"]
  }

  embedder {
    # tei:     Hugging Face text-embeddings-inference, i.e. your own Sentence-Transformers model
    # bedrock: Amazon Titan Text Embeddings v2 or Cohere Embed on Bedrock
    # openai:  OpenAI, or any server with an OpenAI-compatible /embeddings endpoint
    type = "tei"
    url = "http://localhost:8080"
    # model = "amazon.titan-embed-text-v2:0"   # bedrock and openai
    # api-key-env = "OPENAI_API_KEY"           # openai: the variable holding the key, never the key
    dimensions = 384                           # all-MiniLM-L6-v2; must equal the index
    batch-size = 32
    concurrency = 4
    # Most requests started per minute, across all threads; 0 means no limit. Titan Text
    # Embeddings V2 defaults to 60, its non-adjustable on-demand quota.
    # requests-per-minute = 0
    normalize = true
    # Some models want a prefix: E5 uses "passage: " and "query: ".
    document-prefix = ""
    query-prefix = ""
  }

  sink {
    type = "s3vectors"
    vector-bucket = "my-vector-bucket"
    vector-index = "movies"
  }

  processor {
    # After this many failed attempts a batch goes to the dead-letter queue (if set) and the
    # shard moves on; without one, the shard keeps retrying and never skips a batch.
    max-attempts = 10
    # dead-letter-queue-url = "https://sqs.us-east-1.amazonaws.com/123456789012/keyvector-dlq"
    call-process-records-even-for-empty-record-list = false
  }

  coordinator {
    skip-shard-sync-at-worker-initialization-if-leases-exist = true
    parent-shard-poll-interval-millis = 1000
    shard-consumer-dispatch-poll-interval-millis = 500
  }

  lease-management {
    shard-sync-interval-millis = 60000
    leases-recovery-auditor-inconsistency-confidence-threshold = 3
    leases-recovery-auditor-execution-frequency-millis = 5000
    lease-assignment-interval-millis = 1000
  }
}

# The Cassandra driver, used by backfill, resync, redrive and query to read rows.
datastax-java-driver {
  basic {
    contact-points = ["cassandra."${keyvector.REGION}".amazonaws.com:9142"]
    load-balancing-policy.local-datacenter = ${keyvector.REGION}
    request.consistency = LOCAL_QUORUM
    request.timeout = 10 seconds
  }
  advanced {
    ssl-engine-factory {
      class = DefaultSslEngineFactory
      hostname-validation = false
    }
    # SigV4 with the default AWS credentials chain (the ECS task role, a profile, ...).
    auth-provider {
      class = software.aws.mcs.auth.SigV4AuthProvider
      aws-region = ${keyvector.REGION}
    }
    connection.pool.local.size = 3
    reconnection-policy {
      class = ExponentialReconnectionPolicy
      base-delay = 1 second
      max-delay = 60 seconds
    }
  }
}
