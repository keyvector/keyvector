# Keyvector configuration for the arXiv example. The bucket name ends in your AWS account id:
# set SINK_VECTOR_BUCKET=keyvector-papers-<account-id> in the environment.
keyvector {
  REGION = "us-east-1"
  REGION = ${?AWS_REGION}

  stream {
    region = ${keyvector.REGION}
    keyspace-name = "research"
    table-name = "papers"
    application-name = "keyvector-papers"
    connector.target-mapper = "dev.keyvector.connector.KeyvectorTargetMapper"
  }

  sync {
    # The same text AWS's DynamoDB walkthrough embeds: the title and the abstract.
    text-template = "{title}. {abstract}"
    metadata-columns = ["category"]
    on-empty-text = "delete"
  }

  embedder {
    type = "bedrock"
    model = "amazon.titan-embed-text-v2:0"
    dimensions = 1024
    normalize = true
  }

  sink {
    type = "s3vectors"
    vector-bucket = "set-SINK_VECTOR_BUCKET"
    vector-index = "papers"
  }

  processor.max-attempts = 10
  coordinator {
    skip-shard-sync-at-worker-initialization-if-leases-exist = true
    parent-shard-poll-interval-millis = 1000
    shard-consumer-dispatch-poll-interval-millis = 500
  }
  lease-management {
    shard-sync-interval-millis = 60000
    leases-recovery-auditor-inconsistency-confidence-threshold = 3
    leases-recovery-auditor-execution-frequency-millis = 5000
    lease-assignment-interval-millis = 1000
  }
}

datastax-java-driver {
  basic {
    contact-points = ["cassandra."${keyvector.REGION}".amazonaws.com:9142"]
    load-balancing-policy.local-datacenter = ${keyvector.REGION}
    request.consistency = LOCAL_QUORUM
    request.timeout = 10 seconds
  }
  advanced {
    ssl-engine-factory { class = DefaultSslEngineFactory, hostname-validation = false }
    auth-provider { class = software.aws.mcs.auth.SigV4AuthProvider, aws-region = ${keyvector.REGION} }
  }
}
